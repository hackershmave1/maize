services:
  moqesh:
    build: .
    ports:
      - "5000:5000"   # dashboard + API + WebSocket
      - "8080:8080"   # honeypot (the labyrinth served to agents)
    volumes:
      - moqesh-data:/app/data
    environment:
      - MOQESH_DB_PATH=/app/data/moqesh.db
      - MOQESH_ENFORCE_BLOCK=true
      # Public URL that remote sensors will connect to (agent/agentless):
      # - MOQESH_PUBLIC_URL=https://moqesh.example.com
      # AI confirmation (optional): uncomment and configure an OpenAI-compatible endpoint.
      # - MOQESH_AI_ENABLED=true
      # - MOQESH_AI_PROVIDER=openai
      # - MOQESH_AI_BASE_URL=https://openrouter.ai/api/v1
      # - MOQESH_AI_API_KEY=
      # - MOQESH_AI_MODEL=anthropic/claude-haiku-5.5
    restart: unless-stopped

volumes:
  moqesh-data:

name: Cloudflare

on:
  push:
    branches: [main, master]
    paths:
      - "cloudflare/**"
      - ".github/workflows/cloudflare.yml"
  pull_request:
    paths:
      - "cloudflare/**"
      - ".github/workflows/cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: true

env:
  WRANGLER_SEND_METRICS: "false"

jobs:
  worker:
    name: Worker, dashboard, and Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - name: Install dependencies
        run: npm ci --no-fund --no-audit
      - name: Type check
        run: npm run typecheck
      - name: Worker tests
        run: npm test -- --run
      - name: Deployment tests
        run: npm run test:deployment
      - name: Staging origin tests
        run: npm run test:staging-origin
      - name: Binding check
        run: npm run check:bindings
      - name: Build (dashboard + Wrangler dry run, no deploy)
        run: npm run build
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false
      - name: Terraform format
        run: terraform fmt -check -recursive
        working-directory: cloudflare/terraform
      - name: Terraform validate (no backend, no credentials)
        working-directory: cloudflare/terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate

  demo:
    name: Demo script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Lint (ruff)
        run: |
          ruff check cloudflare/scripts cloudflare/test
          ruff format --check cloudflare/scripts cloudflare/test
      - name: Demo tests (offline)
        run: python -m unittest discover -s cloudflare/test -p 'demo_attack_test.py' -v

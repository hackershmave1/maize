# Honeypot reverse proxy. nginx owns the public :8080 socket and emits the headers of
# a real web server (Title-Case names, `Server: nginx/<ver>`, its own `Date`). The ASGI backend
# (uvicorn) stays hidden; its lowercase `Server`/`Date` headers are dropped.
server {
    listen 8080;
    server_name _;
    # server_tokens on (the default) -> "Server: nginx/1.27.x": a realistic, consistent banner.

    # nginx serves ITS OWN 403/404 error pages (its template with "<center>nginx/1.27.x
    # </center>"), consistent with the Server header. Otherwise the backend's error body
    # would carry a different banner and the contradiction would expose the setup. The CTF gate's 401 is NOT
    # intercepted (it must keep its body and WWW-Authenticate).
    proxy_intercept_errors on;
    error_page 403 = @err403;
    error_page 404 = @err404;
    location @err403 { return 403; }
    location @err404 { return 404; }

    location / {
        proxy_pass http://moqesh-ai:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # Attacker's real IP: any incoming X-Forwarded-For is REPLACED with the real peer
        # (not spoofable). The honeypot reads the source IP from this header.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;

        # The backend emits lowercase Server/Date (uvicorn/ASGI); we hide them so nginx
        # sets its own in Title-Case and there are no duplicate or inconsistent headers.
        proxy_hide_header Server;
        proxy_hide_header Date;

        # uvicorn lowercases header names; nginx forwards them as-is. So that
        # a file does NOT have some Title-Case headers (nginx's) and some lowercase ones (the
        # backend's), we hide the upstream's and re-emit them with the canonical name. The value
        # comes from the upstream; if it is empty (e.g. a listing without an ETag), nginx does not add the
        # header, so no empty headers appear.
        proxy_hide_header ETag;
        proxy_hide_header Last-Modified;
        proxy_hide_header Accept-Ranges;
        proxy_hide_header Content-Disposition;
        proxy_hide_header WWW-Authenticate;
        add_header ETag                $upstream_http_etag;
        add_header Last-Modified       $upstream_http_last_modified;
        add_header Accept-Ranges       $upstream_http_accept_ranges;
        add_header Content-Disposition $upstream_http_content_disposition;
        add_header WWW-Authenticate    $upstream_http_www_authenticate always;
    }
}
